version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claw-promptops-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/claw_promptops.db
      - DEFAULT_MODEL=mock-deterministic
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MODEL_TIMEOUT_SECONDS=30
      - MAX_RETRIES=2
      - MAX_REPAIR_ATTEMPTS=2
      - CACHE_ENABLED=true
    volumes:
      - promptops-data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claw-promptops-dashboard
    command: streamlit run ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:////app/data/claw_promptops.db
      - DEFAULT_MODEL=mock-deterministic
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - promptops-data:/app/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  promptops-data:
